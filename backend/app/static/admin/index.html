<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>OTA & SUT Management Portal | AI Teleprompter</title>
  <style>
    :root {
      --bg: #090d16;
      --card-bg: rgba(19, 27, 44, 0.75);
      --card-border: rgba(255, 255, 255, 0.08);
      --primary: #6366f1;
      --primary-hover: #4f46e5;
      --text: #f8fafc;
      --text-muted: #94a3b8;
      --accent: #06b6d4;
      --danger: #ef4444;
      --success: #10b981;
      --warning: #f59e0b;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      display: flex;
      height: 100vh;
      overflow: hidden;
    }
    /* Layout */
    #sidebar {
      width: 250px;
      background: #0f172a;
      border-right: 1px solid var(--card-border);
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      flex-shrink: 0;
    }
    #main-content {
      flex: 1;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      background: #090d16;
    }
    header {
      height: 60px;
      border-bottom: 1px solid var(--card-border);
      padding: 0 24px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: rgba(15, 23, 42, 0.6);
      backdrop-filter: blur(10px);
    }
    #viewport {
      flex: 1;
      overflow-y: auto;
      padding: 24px;
    }
    /* Navigation */
    .brand {
      padding: 18px 20px;
      border-bottom: 1px solid var(--card-border);
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .brand-logo {
      width: 36px;
      height: 36px;
      border-radius: 10px;
      background: linear-gradient(135deg, var(--primary), var(--accent));
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 700;
      color: #fff;
      font-size: 14px;
      box-shadow: 0 4px 12px rgba(99, 102, 241, 0.3);
    }
    .nav-list { padding: 12px; display: flex; flex-direction: column; gap: 4px; }
    .nav-btn {
      display: flex;
      align-items: center;
      justify-content: space-between;
      width: 100%;
      padding: 10px 14px;
      background: transparent;
      border: 1px solid transparent;
      border-radius: 8px;
      color: var(--text-muted);
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
      text-align: left;
      transition: all 0.15s ease;
    }
    .nav-btn:hover { background: rgba(255, 255, 255, 0.05); color: var(--text); }
    .nav-btn.active {
      background: rgba(99, 102, 241, 0.18);
      color: #818cf8;
      border-color: rgba(99, 102, 241, 0.3);
    }
    .badge-count {
      padding: 2px 7px;
      background: #1e293b;
      border-radius: 12px;
      font-size: 11px;
      color: var(--text-muted);
    }
    /* Cards & Grids */
    .grid-kpi {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
      gap: 14px;
      margin-bottom: 24px;
    }
    .card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 12px;
      padding: 18px;
      backdrop-filter: blur(8px);
    }
    .card-title { font-size: 12px; color: var(--text-muted); font-weight: 500; margin-bottom: 6px; }
    .card-val { font-size: 22px; font-weight: 700; color: #fff; }
    .card-val.string { font-size: 17px; font-family: monospace; color: #38bdf8; }
    /* Tables */
    .table-container {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 12px;
      overflow: hidden;
      margin-top: 14px;
    }
    table { width: 100%; border-collapse: collapse; font-size: 12px; text-align: left; }
    th {
      padding: 12px 16px;
      background: rgba(15, 23, 42, 0.8);
      color: var(--text-muted);
      text-transform: uppercase;
      font-size: 10px;
      letter-spacing: 0.05em;
      border-bottom: 1px solid var(--card-border);
    }
    td { padding: 12px 16px; border-bottom: 1px solid rgba(255, 255, 255, 0.04); color: var(--text); }
    tr:hover td { background: rgba(255, 255, 255, 0.02); }
    /* Badges */
    .badge {
      display: inline-block;
      padding: 3px 8px;
      border-radius: 6px;
      font-size: 11px;
      font-weight: 600;
    }
    .badge-online { background: rgba(16, 185, 129, 0.15); color: #34d399; border: 1px solid rgba(16, 185, 129, 0.3); }
    .badge-offline { background: rgba(148, 163, 184, 0.15); color: #94a3b8; border: 1px solid rgba(148, 163, 184, 0.3); }
    .badge-blocked { background: rgba(239, 68, 68, 0.15); color: #f87171; border: 1px solid rgba(239, 68, 68, 0.3); }
    .badge-status { background: #1e293b; color: #cbd5e1; border: 1px solid #334155; }
    .badge-success { background: rgba(16, 185, 129, 0.2); color: #34d399; border: 1px solid #10b981; }
    /* Buttons & Inputs */
    .btn {
      padding: 8px 14px;
      background: var(--primary);
      color: #fff;
      border: none;
      border-radius: 8px;
      font-size: 12px;
      font-weight: 500;
      cursor: pointer;
      transition: background 0.15s ease;
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }
    .btn:hover { background: var(--primary-hover); }
    .btn-secondary { background: #1e293b; color: #e2e8f0; border: 1px solid var(--card-border); }
    .btn-secondary:hover { background: #334155; }
    .btn-danger { background: rgba(239, 68, 68, 0.2); color: #f87171; border: 1px solid rgba(239, 68, 68, 0.4); }
    .btn-danger:hover { background: rgba(239, 68, 68, 0.4); }
    .btn-success { background: rgba(16, 185, 129, 0.2); color: #34d399; border: 1px solid rgba(16, 185, 129, 0.4); }
    .btn-success:hover { background: rgba(16, 185, 129, 0.4); }
    .btn-sm { padding: 4px 10px; font-size: 11px; border-radius: 6px; }
    input, select, textarea {
      padding: 8px 12px;
      background: #0f172a;
      border: 1px solid var(--card-border);
      border-radius: 8px;
      color: #fff;
      font-size: 12px;
      outline: none;
      transition: border-color 0.15s ease;
    }
    input:focus, select:focus, textarea:focus { border-color: var(--primary); }
    /* Modal */
    .modal-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.75);
      backdrop-filter: blur(4px);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 100;
      padding: 16px;
    }
    .modal-box {
      background: #0f172a;
      border: 1px solid var(--card-border);
      border-radius: 14px;
      max-width: 600px;
      width: 100%;
      max-height: 85vh;
      overflow-y: auto;
      padding: 24px;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.5);
    }
    /* Toast */
    #toast {
      position: fixed;
      top: 16px;
      right: 16px;
      padding: 12px 18px;
      border-radius: 8px;
      background: #064e3b;
      color: #a7f3d0;
      border: 1px solid #059669;
      font-size: 13px;
      z-index: 200;
      display: none;
      box-shadow: 0 8px 24px rgba(0,0,0,0.4);
    }
    .progress-bar-bg {
      width: 100%;
      height: 6px;
      background: #1e293b;
      border-radius: 3px;
      overflow: hidden;
      margin-top: 4px;
    }
    .progress-bar-fill { height: 100%; background: var(--primary); border-radius: 3px; }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <!-- Toast notification -->
  <div id="toast">Operation successful</div>

  <!-- SIDEBAR -->
  <aside id="sidebar">
    <div>
      <div class="brand">
        <div class="brand-logo">OTA</div>
        <div>
          <div style="font-weight: 600; font-size: 14px;">AI Teleprompter</div>
          <div style="font-size: 11px; color: var(--text-muted);">SUT & OTA Portal</div>
        </div>
      </div>
      <nav class="nav-list">
        <button class="nav-btn active" data-tab="dashboard" onclick="switchTab('dashboard', this)">
          <span>📊 Dashboard</span>
        </button>
        <button class="nav-btn" data-tab="devices" onclick="switchTab('devices', this)">
          <span>💻 Devices / SUTs</span>
          <span class="badge-count" id="badge-devices">0</span>
        </button>
        <button class="nav-btn" data-tab="ota_jobs" onclick="switchTab('ota_jobs', this)">
          <span>🚀 OTA Updates</span>
          <span class="badge-count" id="badge-jobs">0</span>
        </button>
        <button class="nav-btn" data-tab="versions" onclick="switchTab('versions', this)">
          <span>📦 Versions Catalog</span>
        </button>
        <button class="nav-btn" data-tab="analytics" onclick="switchTab('analytics', this)">
          <span>📈 Usage Analytics</span>
        </button>
        <button class="nav-btn" data-tab="licenses" onclick="switchTab('licenses', this)">
          <span>🔑 Licenses</span>
        </button>
        <button class="nav-btn" data-tab="history" onclick="switchTab('history', this)">
          <span>📜 Update History</span>
        </button>
        <button class="nav-btn" data-tab="logs" onclick="switchTab('logs', this)">
          <span>📋 Activity Logs</span>
        </button>
        <button class="nav-btn" data-tab="settings" onclick="switchTab('settings', this)">
          <span>⚙️ Settings</span>
        </button>
      </nav>
    </div>

    <!-- Admin Footer -->
    <div style="padding: 16px; border-top: 1px solid var(--card-border); display: flex; align-items: center; justify-content: space-between;">
      <div style="display: flex; align-items: center; gap: 10px;">
        <div style="width: 32px; height: 32px; border-radius: 50%; background: #1e293b; border: 1px solid var(--card-border); display: flex; align-items: center; justify-content: center; font-weight: bold; color: var(--primary); font-size: 12px;">D</div>
        <div>
          <div style="font-size: 12px; font-weight: 600;" id="admin-name">Diwakar</div>
          <div style="font-size: 10px; color: var(--text-muted);">Administrator</div>
        </div>
      </div>
      <button class="btn btn-secondary btn-sm" onclick="logout()" title="Logout">🚪</button>
    </div>
  </aside>

  <!-- MAIN -->
  <main id="main-content">
    <header>
      <div style="display: flex; align-items: center; gap: 12px;">
        <h2 id="tab-title" style="font-size: 16px; font-weight: 600;">Dashboard Overview</h2>
        <span style="font-size: 11px; color: var(--text-muted);">| Central SUT Monitoring</span>
      </div>
      <div style="display: flex; align-items: center; gap: 12px;">
        <button class="btn btn-secondary btn-sm" onclick="loadAllData()">🔄 Refresh</button>
        <div id="conn-badge" style="padding: 4px 10px; background: rgba(16, 185, 129, 0.15); border: 1px solid rgba(16, 185, 129, 0.3); border-radius: 20px; font-size: 11px; color: #34d399;">
          ● Backend Connected
        </div>
      </div>
    </header>

    <div id="viewport">
      <div style="display: flex; flex-direction: column; align-items: center; justify-content: center; height: 50vh; gap: 14px; color: var(--text-muted);">
        <div style="width: 32px; height: 32px; border: 3px solid rgba(99, 102, 241, 0.2); border-top-color: var(--primary); border-radius: 50%; animation: spin 0.8s linear infinite;"></div>
        <div style="font-size: 13px; font-weight: 500;">Loading Central Management Portal...</div>
      </div>
    </div>
  </main>

  <!-- MODAL CONTAINER -->
  <div id="modal-container" style="display: none;"></div>

  <script>
    const API = window.location.origin;
    let state = {
      token: localStorage.getItem("ota_token") || "",
      activeTab: "dashboard",
      devices: [],
      versions: [],
      otaJobs: [],
      licenses: [],
      analytics: null,
      auditLogs: [],
      settings: null,
      bulkSelection: [],
    };

    function showToast(msg, isError = false) {
      const t = document.getElementById("toast");
      t.innerText = msg;
      t.style.background = isError ? "#7f1d1d" : "#064e3b";
      t.style.color = isError ? "#fca5a5" : "#a7f3d0";
      t.style.borderColor = isError ? "#ef4444" : "#059669";
      t.style.display = "block";
      setTimeout(() => { t.style.display = "none"; }, 3500);
    }

    async function api(path, method = "GET", body = null) {
      const headers = { "Content-Type": "application/json" };
      if (state.token) headers["Authorization"] = `Bearer ${state.token}`;
      const opts = { method, headers };
      if (body) opts.body = JSON.stringify(body);
      try {
        let res = await fetch(`${API}${path}`, opts);
        if (res.status === 401 && !path.includes("/login")) {
          // Token expired or invalid, try auto-login once
          const loginSuccess = await tryAutoLogin();
          if (loginSuccess && state.token) {
            headers["Authorization"] = `Bearer ${state.token}`;
            res = await fetch(`${API}${path}`, opts);
          }
          if (res.status === 401) {
            showLoginModal();
            return null;
          }
        }
        if (!res.ok) {
          console.warn(`API returned ${res.status} for ${path}`);
          return null;
        }
        return await res.json();
      } catch (e) {
        console.error("API error:", e);
        return null;
      }
    }

    async function tryAutoLogin() {
      try {
        const res = await fetch(`${API}/api/v1/auth/login`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ email: "admin@teleprompter.local", password: "admin" })
        });
        if (res.ok) {
          const d = await res.json();
          state.token = d.access_token;
          localStorage.setItem("ota_token", d.access_token);
          const nameEl = document.getElementById("admin-name");
          if (nameEl) nameEl.innerText = d.user_name || "Diwakar";
          return true;
        }
      } catch (e) {
        console.warn("Auto-login request failed:", e);
      }
      return false;
    }

    function showLoginModal() {
      const m = document.getElementById("modal-container");
      m.style.display = "flex";
      m.className = "modal-backdrop";
      m.innerHTML = `
        <div class="modal-box" style="max-width: 380px; text-align: center;">
          <div style="width: 48px; height: 48px; border-radius: 12px; background: linear-gradient(135deg, var(--primary), var(--accent)); display: flex; align-items: center; justify-content: center; font-weight: 800; font-size: 20px; color: #fff; margin: 0 auto 16px auto; box-shadow: 0 4px 16px rgba(99, 102, 241, 0.4);">
            OTA
          </div>
          <h3 style="font-size: 18px; font-weight: 700; margin-bottom: 6px;">Admin Authentication</h3>
          <p style="font-size: 12px; color: var(--text-muted); margin-bottom: 20px;">Sign in to access the OTA & SUT Management Portal.</p>
          
          <div id="login-error" style="display: none; padding: 8px 12px; background: rgba(239, 68, 68, 0.15); border: 1px solid rgba(239, 68, 68, 0.3); border-radius: 6px; font-size: 12px; color: #f87171; margin-bottom: 14px; text-align: left;"></div>

          <div style="display: flex; flex-direction: column; gap: 12px; text-align: left; margin-bottom: 20px;">
            <div>
              <label style="display: block; font-size: 11px; color: var(--text-muted); margin-bottom: 4px;">Admin Email</label>
              <input type="email" id="login-email" value="admin@teleprompter.local" style="width: 100%;">
            </div>
            <div>
              <label style="display: block; font-size: 11px; color: var(--text-muted); margin-bottom: 4px;">Password</label>
              <input type="password" id="login-password" value="admin" style="width: 100%;" onkeydown="if(event.key==='Enter') submitLogin();">
            </div>
          </div>

          <button class="btn" style="width: 100%; padding: 12px;" onclick="submitLogin()">Sign In to Dashboard</button>
        </div>
      `;
    }

    async function submitLogin() {
      const email = document.getElementById("login-email")?.value;
      const password = document.getElementById("login-password")?.value;
      const errBox = document.getElementById("login-error");
      if (!email || !password) {
        if (errBox) { errBox.style.display = "block"; errBox.innerText = "Email and password are required."; }
        return;
      }
      try {
        const res = await fetch(`${API}/api/v1/auth/login`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ email, password })
        });
        if (res.ok) {
          const d = await res.json();
          state.token = d.access_token;
          localStorage.setItem("ota_token", d.access_token);
          const nameEl = document.getElementById("admin-name");
          if (nameEl) nameEl.innerText = d.user_name || "Diwakar";
          closeModal();
          showToast("Authenticated successfully!");
          loadAllData();
        } else {
          const err = await res.json().catch(() => ({}));
          if (errBox) { errBox.style.display = "block"; errBox.innerText = err.detail || "Invalid credentials."; }
        }
      } catch (e) {
        if (errBox) { errBox.style.display = "block"; errBox.innerText = "Connection error to backend."; }
      }
    }

    async function loadAllData() {
      try {
        if (!state.token) {
          await tryAutoLogin();
        }
        const [devs, vers, jobs, lics, anas, sets, logs] = await Promise.all([
          api("/api/v1/devices"),
          api("/api/v1/versions"),
          api("/api/v1/ota/jobs"),
          api("/api/v1/licenses"),
          api("/api/v1/usage/analytics"),
          api("/api/v1/settings/system"),
          api("/api/v1/audit-logs?limit=50"),
        ]);

        if (devs) state.devices = devs;
        if (vers) state.versions = vers;
        if (jobs) state.otaJobs = jobs;
        if (lics) state.licenses = lics;
        if (anas) state.analytics = anas;
        if (sets) state.settings = sets;
        if (logs) state.auditLogs = logs;

        const badgeDevs = document.getElementById("badge-devices");
        if (badgeDevs) badgeDevs.innerText = state.devices.length;
        const badgeJobs = document.getElementById("badge-jobs");
        if (badgeJobs) badgeJobs.innerText = state.otaJobs.filter(j => j.status === 'PENDING' || j.status === 'INSTALLING').length;

        const connBadge = document.getElementById("conn-badge");
        if (connBadge) {
          connBadge.innerHTML = "● Backend Connected";
          connBadge.style.color = "#34d399";
          connBadge.style.borderColor = "rgba(16, 185, 129, 0.3)";
        }
      } catch (err) {
        console.error("Error loading dashboard data:", err);
        const connBadge = document.getElementById("conn-badge");
        if (connBadge) {
          connBadge.innerHTML = "● Connection Warning";
          connBadge.style.color = "#f87171";
          connBadge.style.borderColor = "rgba(239, 68, 68, 0.3)";
        }
      } finally {
        renderCurrentTab();
      }
    }

    function switchTab(tabId, el) {
      state.activeTab = tabId;
      document.querySelectorAll(".nav-btn").forEach(btn => btn.classList.remove("active"));
      if (el) {
        el.classList.add("active");
      } else {
        const targetBtn = document.querySelector(`.nav-btn[data-tab="${tabId}"]`);
        if (targetBtn) targetBtn.classList.add("active");
      }
      renderCurrentTab();
    }

    function renderCurrentTab() {
      const vp = document.getElementById("viewport");
      const title = document.getElementById("tab-title");

      switch (state.activeTab) {
        case "dashboard":
          title.innerText = "Dashboard Overview";
          renderDashboard(vp);
          break;
        case "devices":
          title.innerText = "Systems Under Test (SUT)";
          renderDevices(vp);
          break;
        case "ota_jobs":
          title.innerText = "Remote OTA Deployments";
          renderOTAJobs(vp);
          break;
        case "versions":
          title.innerText = "Catalog Versions Repository";
          renderVersions(vp);
          break;
        case "analytics":
          title.innerText = "Usage Analytics";
          renderAnalytics(vp);
          break;
        case "licenses":
          title.innerText = "Device Licenses & Quotas";
          renderLicenses(vp);
          break;
        case "history":
          title.innerText = "Immutable Update History";
          renderHistory(vp);
          break;
        case "logs":
          title.innerText = "Audit & Activity Logs";
          renderLogs(vp);
          break;
        case "settings":
          title.innerText = "Portal & Support Settings";
          renderSettings(vp);
          break;
      }
    }

    // ─── DASHBOARD ───────────────────────────────────────────────────────────
    function renderDashboard(el) {
      const s = state.analytics?.summary || {
        total_devices: state.devices.length,
        online_devices: state.devices.filter(d => d.status === 'online').length,
        offline_devices: state.devices.filter(d => d.status === 'offline').length,
        blocked_devices: state.devices.filter(d => d.status === 'blocked').length,
        current_version: "v0.1.0",
        total_updates: state.otaJobs.length,
        successful_updates: state.otaJobs.filter(j => j.status === 'SUCCESS').length,
      };

      let html = `
        <div class="grid-kpi">
          <div class="card"><div class="card-title">Total SUTs</div><div class="card-val">${s.total_devices}</div></div>
          <div class="card"><div class="card-title">Online SUTs</div><div class="card-val" style="color: #34d399;">${s.online_devices}</div></div>
          <div class="card"><div class="card-title">Offline SUTs</div><div class="card-val" style="color: #94a3b8;">${s.offline_devices}</div></div>
          <div class="card"><div class="card-title">Blocked SUTs</div><div class="card-val" style="color: #f87171;">${s.blocked_devices}</div></div>
          <div class="card"><div class="card-title">Active Build</div><div class="card-val string">${s.current_version}</div></div>
          <div class="card"><div class="card-title">OTA Success</div><div class="card-val string" style="color: #a855f7;">${s.successful_updates} / ${s.total_updates}</div></div>
        </div>

        <div style="display: grid; grid-template-columns: 2fr 1fr; gap: 16px; margin-bottom: 24px;">
          <!-- 14-Day Activity -->
          <div class="card">
            <div style="display: flex; justify-content: space-between; margin-bottom: 16px;">
              <span style="font-weight: 600; font-size: 13px;">14-Day Execution Volume</span>
              <span style="font-size: 11px; color: var(--text-muted);">Real-time Teleprompter Operations</span>
            </div>
            <div style="height: 140px; display: flex; align-items: flex-end; gap: 8px; border-bottom: 1px solid var(--card-border); padding-bottom: 6px;">
              ${(state.analytics?.daily_usage || []).map(d => {
                const max = Math.max(...(state.analytics.daily_usage.map(x => x.count)), 5);
                const h = Math.max(10, Math.round((d.count / max) * 100));
                return `

    function filterDevices() {
      const q = document.getElementById("dev-search").value.toLowerCase();
      const filtered = state.devices.filter(d =>
        d.device_id.toLowerCase().includes(q) ||
        d.hostname.toLowerCase().includes(q) ||
        d.application_version.toLowerCase().includes(q)
      );
      document.getElementById("devices-tbody").innerHTML = renderDeviceRows(filtered);
    }

    function toggleSelectAll(cb) {
      if (cb.checked) {
        state.bulkSelection = state.devices.map(d => d.device_id);
      } else {
        state.bulkSelection = [];
      }
      renderDevices(document.getElementById("viewport"));
    }

    function toggleSelectOne(id) {
      if (state.bulkSelection.includes(id)) {
        state.bulkSelection = state.bulkSelection.filter(x => x !== id);
      } else {
        state.bulkSelection.push(id);
      }
      renderDevices(document.getElementById("viewport"));
    }

    async function toggleBlockDevice(id, isBlocked) {
      const action = isBlocked ? "unblock" : "block";
      if (!confirm(`Are you sure you want to ${action} ${id}?`)) return;
      const res = await api(`/api/v1/devices/${id}/${action}`, "POST");
      if (res && res.status === "ok") {
        showToast(`Device ${id} ${action}ed`);
        loadAllData();
      }
    }

    async function changeLimit(id, cur) {
      const v = prompt(`Set new free limit for ${id}:`, cur);

      const res = await api(`/api/v1/licenses/${id}`, "PUT", { usage_limit: parseInt(v) });
      if (res && res.status === "ok") {
        showToast(`Limit updated to ${v}`);
        loadAllData();

            <div class="card"><div class="card-title">License Status</div><div><span class="badge badge-${d.license?.status}">${d.license?.status}</span></div></div>
          </div>

          <!-- Remote Upgrade / Downgrade -->
          <div class="card" style="margin-bottom: 16px;">
            <div style="font-weight: 600; font-size: 12px; margin-bottom: 8px;">Remote Upgrade / Downgrade via OTA</div>
            <div style="display: flex; gap: 8px;">
              <select id="modal-target-ver" style="flex: 1;">
                ${state.versions.map(v => `
                  <option value="${v.version}">${v.version} (${v.version === d.application_version ? "Installed" : (v.version > d.application_version ? "Upgrade" : "Downgrade")})</option>
                `).join("")}
              </select>
              <button class="btn" onclick="dispatchOTA('${d.device_id}', '${d.application_version}')">🚀 Deploy OTA</button>
            </div>
          </div>
        </div>
      `;
    }

    async function dispatchOTA(devId, curVer) {
      const target = document.getElementById("modal-target-ver").value;
      if (!target) return;
      const isDowngrade = target < curVer;
      if (!confirm(`Dispatch ${isDowngrade ? 'DOWNGRADE' : 'UPGRADE'} of ${devId} to ${target}?`)) return;

      const res = await api("/api/v1/ota/jobs", "POST", {
        device_id: devId,
        target_version: target,
        job_type: isDowngrade ? "downgrade" : "upgrade"
      });
      if (res && res.status === "ok") {
        showToast(`OTA job created for ${devId} -> ${target}`);
        closeModal();
        loadAllData();
      }
    }

    // ─── MODALS ──────────────────────────────────────────────────────────────
    function showCreateJobModal() {
      const m = document.getElementById("modal-container");
      m.style.display = "flex";
      m.className = "modal-backdrop";
      m.innerHTML = `
        <div class="modal-box" style="max-width: 420px;">
          <h3 style="font-size: 15px; font-weight: 700; margin-bottom: 14px;">Schedule OTA Update</h3>
          <div style="display: flex; flex-direction: column; gap: 12px; margin-bottom: 16px;">
            <div>
              <label style="display: block; font-size: 11px; color: var(--text-muted); margin-bottom: 4px;">Target Device</label>
              <select id="single-dev" style="width: 100%;">
                ${state.devices.map(d => `<option value="${d.device_id}">${d.device_id} (${d.hostname}) - ${d.application_version}</option>`).join("")}
              </select>
            </div>
            <div>
              <label style="display: block; font-size: 11px; color: var(--text-muted); margin-bottom: 4px;">Target Version</label>
              <select id="single-ver" style="width: 100%;">
                ${state.versions.map(v => `<option value="${v.version}">${v.version}</option>`).join("")}
              </select>
            </div>
          </div>
          <div style="display: flex; justify-content: flex-end; gap: 8px;">
            <button class="btn btn-secondary" onclick="closeModal()">Cancel</button>
            <button class="btn" onclick="submitSingleJob()">Dispatch Job</button>
          </div>
        </div>
      `;
    }

    async function submitSingleJob() {
      const dev = document.getElementById("single-dev").value;
      const ver = document.getElementById("single-ver").value;
      const res = await api("/api/v1/ota/jobs", "POST", { device_id: dev, target_version: ver });
      if (res && res.status === "ok") {
        showToast(`Job created for ${dev}`);
        closeModal();
        loadAllData();
      }
    }

    function showBulkDeployModal() {
      const ids = state.bulkSelection.length > 0 ? state.bulkSelection : state.devices.map(d => d.device_id);
      const m = document.getElementById("modal-container");
      m.style.display = "flex";
      m.className = "modal-backdrop";
      m.innerHTML = `
        <div class="modal-box" style="max-width: 440px;">
          <h3 style="font-size: 15px; font-weight: 700; margin-bottom: 8px;">Bulk OTA Deployment</h3>
          <p style="font-size: 12px; color: var(--text-muted); margin-bottom: 12px;">Deploying simultaneous update across ${ids.length} selected SUTs.</p>
          <div style="max-height: 100px; overflow-y: auto; background: rgba(0,0,0,0.3); padding: 8px; border-radius: 6px; font-family: monospace; font-size: 11px; color: var(--text-muted); margin-bottom: 14px;">
            ${ids.map(x => `<div>✓ ${x}</div>`).join("")}
          </div>
          <div style="margin-bottom: 16px;">
            <label style="display: block; font-size: 11px; color: var(--text-muted); margin-bottom: 4px;">Target Version</label>
            <select id="bulk-ver" style="width: 100%;">
              ${state.versions.map(v => `<option value="${v.version}">${v.version}</option>`).join("")}
            </select>
          </div>
          <div style="display: flex; justify-content: flex-end; gap: 8px;">
            <button class="btn btn-secondary" onclick="closeModal()">Cancel</button>
            <button class="btn" onclick="submitBulkDeploy()">🚀 Deploy to ${ids.length} SUTs</button>
          </div>
        </div>
      `;
    }

    async function submitBulkDeploy() {
      const ids = state.bulkSelection.length > 0 ? state.bulkSelection : state.devices.map(d => d.device_id);
      const target = document.getElementById("bulk-ver").value;
      const res = await api("/api/v1/ota/jobs/bulk", "POST", { device_ids: ids, target_version: target });
      if (res && res.status === "ok") {
        showToast(`Dispatched updates to ${res.created_jobs_count} SUTs!`);
        closeModal();
        loadAllData();
      }
    }

    function showAddVersionModal() {
      const m = document.getElementById("modal-container");
      m.style.display = "flex";
      m.className = "modal-backdrop";
      m.innerHTML = `
        <div class="modal-box" style="max-width: 440px;">
          <h3 style="font-size: 15px; font-weight: 700; margin-bottom: 14px;">Register New Version</h3>
          <div style="display: flex; flex-direction: column; gap: 10px; margin-bottom: 16px;">
            <div>
              <label style="display: block; font-size: 11px; color: var(--text-muted); margin-bottom: 4px;">Version String (e.g. v0.3.0)</label>
              <input type="text" id="new-ver" value="v0.3.0" style="width: 100%;">
            </div>
            <div>
              <label style="display: block; font-size: 11px; color: var(--text-muted); margin-bottom: 4px;">Build Number</label>
              <input type="number" id="new-build" value="110" style="width: 100%;">
            </div>
            <div>
              <label style="display: block; font-size: 11px; color: var(--text-muted); margin-bottom: 4px;">Package URL</label>
              <input type="text" id="new-url" value="/api/v1/ota/packages/v0.3.0.zip" style="width: 100%;">
            </div>
            <div>
              <label style="display: block; font-size: 11px; color: var(--text-muted); margin-bottom: 4px;">SHA-256 Checksum</label>
              <input type="text" id="new-hash" value="e3b0c44298fc1c149afbf4c8996fb92427ae41e4649b934ca495991b7852b855" style="width: 100%; font-family: monospace; font-size: 11px;">
            </div>
            <div>
              <label style="display: block; font-size: 11px; color: var(--text-muted); margin-bottom: 4px;">Release Notes</label>
              <textarea id="new-notes" rows="2" style="width: 100%;">Performance optimizations and stability improvements.</textarea>
            </div>
          </div>
          <div style="display: flex; justify-content: flex-end; gap: 8px;">
            <button class="btn btn-secondary" onclick="closeModal()">Cancel</button>
            <button class="btn" onclick="submitNewVersion()">Register Version</button>
          </div>
        </div>
      `;
    }

    async function submitNewVersion() {
      const payload = {
        version: document.getElementById("new-ver").value,
        build_number: parseInt(document.getElementById("new-build").value),
        package_url: document.getElementById("new-url").value,
        package_hash: document.getElementById("new-hash").value,
        release_notes: document.getElementById("new-notes").value,
        status: "Available",
      };
      const res = await api("/api/v1/versions", "POST", payload);
      if (res && res.status === "ok") {
        showToast(`Version ${payload.version} published!`);
        closeModal();
        loadAllData();
      }
    }

    function closeModal() {
      document.getElementById("modal-container").style.display = "none";
    }

    function logout() {
      localStorage.removeItem("ota_token");
      state.token = "";
      location.reload();
    }

    // Auto-init on load
    function initDashboard() {
      renderCurrentTab();
      loadAllData();
      setInterval(loadAllData, 20000);
    }

    if (document.readyState === "loading") {
      document.addEventListener("DOMContentLoaded", initDashboard);
    } else {
      initDashboard();
    }
  </script>
</body>
</html>
